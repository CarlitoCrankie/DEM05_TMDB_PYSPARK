services:
  spark-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tmdb_spark
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./data:/app/data
      - ./visualizations:/app/visualizations
      - ./scripts:/app/scripts
      - ./logs:/app/logs
      - ./new_config.py:/app/new_config.py
      - ./.env:/app/.env
      - ./TMDB_EDA.ipynb:/app/TMDB_EDA.ipynb
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - SPARK_DRIVER_MEMORY=4g
      - SPARK_EXECUTOR_MEMORY=4g
    stdin_open: true
    tty: true

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tmdb_pipeline
    volumes:
      - ./data:/app/data
      - ./visualizations:/app/visualizations
      - ./scripts:/app/scripts
      - ./logs:/app/logs
      - ./new_config.py:/app/new_config.py
      - ./.env:/app/.env
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
    command: ["python", "scripts/pipeline.py"]
    profiles:
      - pipeline
